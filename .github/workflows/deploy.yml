name: Deploy (Azure)

# Builds the container image, pushes it to Azure Container Registry and points
# the App Service at it (ADR 0024, docs/DEPLOY_AZURE.md). Runs after CI passes
# on main, or manually. Does nothing until the repository variables below are
# set. Authentication is OIDC with the managed identity from infra/main.bicep:
# no Azure credentials are stored in GitHub.
#
# Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, AZURE_ACR_NAME, AZURE_WEBAPP_NAME.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "${{ vars.AZURE_ACR_NAME }}"
          IMAGE="${{ vars.AZURE_ACR_NAME }}.azurecr.io/sk-management:${SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to App Service
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --container-image-name "$IMAGE"
          az webapp restart --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_NAME }}"

      - name: Wait for health check
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          for i in $(seq 1 60); do
            if curl -fsS "$URL"; then echo; echo "Healthy: $IMAGE"; exit 0; fi
            sleep 10
          done
          echo "Health check did not pass in 10 minutes: $URL" >&2
          exit 1
