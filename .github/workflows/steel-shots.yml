name: Steel demo screenshots

on:
  push:
    branches: [demo/steel-screenshots]

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://sk:sk_ci_password@localhost:5432/sk_management
  TEST_DATABASE_URL: postgresql://sk:sk_ci_password@localhost:5432/sk_management_test
  AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
  AUTH_URL: http://localhost:3100
  AUTH_TRUST_HOST: "true"
  DEV_LOGIN_ENABLED: "true"
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: eu-north-1
  S3_BUCKET: sk-management-ci
  S3_ACCESS_KEY_ID: sk_minio
  S3_SECRET_ACCESS_KEY: sk_minio_password
  S3_FORCE_PATH_STYLE: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  shots:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sk
          POSTGRES_PASSWORD: sk_ci_password
          POSTGRES_DB: sk_management
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sk" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=sk_minio -e MINIO_ROOT_PASSWORD=sk_minio_password \
            pgsty/minio:latest server /data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: mkdir -p tests/e2e/.auth && pnpm exec playwright test tests/e2e/auth.setup.ts tests/e2e/steel-shots.spec.ts
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f docs/screenshots-steel/*.png test-results 2>/dev/null || true
          git commit -m "Steel demo screenshots [skip ci]" || echo "nothing to commit"
          git push
